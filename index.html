<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pisces</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #121212;
  color: #e0e0e0;
  font-family: 'Inter', Arial, sans-serif;
  height: 100%;
  width: 100%;
  overflow-x: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-top: 100px;
  transition: all 0.5s ease;
  width: 100%;
  text-align: center;
  gap: 20px;
}

.header.topbar {
  flex-direction: row;
  justify-content: flex-start;
  align-items: center;
  position: fixed;
  top: 0;
  left: 0;
  background: #121212;
  padding: 10px 30px;
  border-bottom: 1px solid #2a2a2a;
  margin-top: 0;
  z-index: 999;
  gap: 15px;
}

.logo-container {
  font-size: 100px;
  color: #aaa;
  cursor: pointer;
  line-height: 1;
  white-space: nowrap;
  transition: all 0.5s ease;
}

.header.topbar .logo-container {
  font-size: 36px;
  margin-right: 15px;
}

.logo-text {
  font-size: 48px;
  font-weight: 700;
  color: #ccc;
  margin: 0;
  word-break: break-word;
  transition: all 0.5s ease;
}

.header.topbar .logo-text {
  font-size: 20px;
  margin-top: 0;
}

.search-container {
  display: flex;
  align-items: center;
  background: #1e1e1e;
  border-radius: 25px;
  border: 1px solid #555;
  padding: 0 15px;
  width: 50%;
  max-width: 500px;
  transition: all 0.5s ease;
}

.header.topbar .search-container {
  margin-top: 0;
  width: 400px;
}

.search-container input {
  flex: 1;
  padding: 12px;
  font-size: 16px;
  border: none;
  outline: none;
  background: transparent;
  color: #fff;
  border-radius: 25px;
}

.search-container i {
  color: #888;
  font-size: 18px;
  margin-left: 10px;
  cursor: pointer;
}

#aiSummary {
  margin-top: 50px;
  background: #1b1b1b;
  padding: 25px;
  border-radius: 12px;
  width: 90%;
  max-width: 1200px;
  font-size: 16px;
  line-height: 1.5;
  word-break: break-word;
  transition: all 0.5s ease;
  display: none;
}

#results {
  margin-top: 20px;
  width: 100%;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.result {
  background: #1e1e1e;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  word-break: break-word;
  width: 100%;
  max-width: 1200px;
}

.result-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.result-header img {
  width: 16px;
  height: 16px;
  border-radius: 4px;
}

.result-header a.title {
  color: #aaa;
  font-weight: bold;
  text-decoration: none;
}

.result-header span.domain {
  color: #888;
  font-size: 12px;
}

.result p {
  margin: 5px 0 0 0;
  color: #ccc;
}

.cookie-notice {
  position: fixed;
  bottom: 20px;
  background: #1e1e1e;
  color: #ccc;
  padding: 12px 24px;
  border-radius: 12px;
  border: 1px solid #555;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 15px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(30px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.cookie-notice.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.cookie-notice button {
  background: #2a2a2a;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

.cookie-notice button:hover {
  background: #3a3a3a;
}

a.ai-link {
  color: #ccc;
  text-decoration: underline;
}

@media (max-width: 700px) {
  .search-container, #aiSummary {
    width: 90%;
  }

  .result {
    max-width: 95%;
  }
}
</style>
</head>
<body>

<div class="header" id="header">
  <div class="logo-container" id="logo"><i class="fas fa-fish"></i></div>
  <div class="logo-text">Pisces</div>
  <div class="search-container">
    <input type="text" id="query" placeholder="Search..." onkeydown="if(event.key==='Enter') doSearch()">
    <i class="fas fa-search" onclick="doSearch()"></i>
  </div>
</div>

<div id="aiSummary"></div>
<div id="results"></div>

<div class="cookie-notice show" id="cookieNotice">
  We use cookies to improve your experience.
  <button id="cookieAccept">Accept</button>
</div>
  
<script src="/assets/script/first.js"></script>

<script>
const cookieNotice = document.getElementById('cookieNotice');
const cookieAccept = document.getElementById('cookieAccept');
cookieNotice.classList.add('show');
cookieAccept.addEventListener('click', () => cookieNotice.classList.remove('show'));

const SEARCHAPI_KEY = 'kxQcf8JkcTrzcMehEWSQJkzQ';
const GROQ_KEY = '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';

async function fetchSearchApi(query) {
  const res = await fetch(`https://www.searchapi.io/api/v1/search?engine=google&q=${encodeURIComponent(query)}&api_key=${SEARCHAPI_KEY}`);
  const data = await res.json();
  return data.organic_results || [];
}

function linkifyParentheses(text) {
  return text.replace(/\((https?:\/\/[^\s)]+)\)/g, '<a class="ai-link" href="$1" target="_blank">$1</a>');
}

async function generateAISummary(items, query) {
  const context = items.slice(0,5).map((item,i)=>`${i+1}. ${item.title}: ${item.snippet} (${item.link})`).join('\n');
  const prompt = `You are an AI assistant. Based on the following search results, answer the user query concisely and include links in parentheses.\nQuery: "${query}"\nSearch Results:\n${context}\nAnswer concisely and reference links if useful.`;
  const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
    body: JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:prompt}],temperature:0.2})
  });
  const data = await resp.json();
  let content = data.choices[0].message.content;
  return linkifyParentheses(content);
}

function displayResults(items){
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'result';
    const url = new URL(item.link);
    const faviconUrl = `https://www.google.com/s2/favicons?domain=${url.hostname}`;
    const baseDomain = url.hostname.replace(/^www\./,'');
    div.innerHTML = `
      <div class="result-header">
        <img src="${faviconUrl}" alt="favicon">
        <a class="title" href="${item.link}" target="_blank">${item.title}</a>
        <span class="domain">${baseDomain}</span>
      </div>
      <p>${item.snippet}</p>
    `;
    resultsDiv.appendChild(div);
  });
}

const header = document.getElementById('header');
const logo = document.getElementById('logo');

async function doSearch() {
  const query = document.getElementById('query').value.trim();
  if (!query) return;

  header.classList.add('topbar');
  const aiDiv = document.getElementById('aiSummary');
  aiDiv.style.display = 'block';
  aiDiv.style.marginTop = '220px';
  aiDiv.innerHTML = '<strong>Pisces AI response:</strong> Generating response...';

  const items = await fetchSearchApi(query);
  displayResults(items);

  const summary = await generateAISummary(items, query);
  aiDiv.innerHTML = '<strong>Pisces AI response:</strong> ' + summary;

  const topbarHeight = header.offsetHeight + 60;
  const y = aiDiv.getBoundingClientRect().top + window.scrollY - topbarHeight;
  window.scrollTo({top: y, behavior:'smooth'});
}

logo.addEventListener('click', () => {
  header.classList.remove('topbar');
  const aiDiv = document.getElementById('aiSummary');
  aiDiv.innerHTML = '';
  aiDiv.style.display = 'none';
  document.getElementById('results').innerHTML = '';
  document.getElementById('query').value = '';
  window.scrollTo({top:0, behavior:'smooth'});
});
</script>

</body>
</html>
